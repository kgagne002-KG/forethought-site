<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal Login | Forethought Care & Support</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script defer>
      function go() {
        const ref = document.getElementById("ref").value.trim();
        if (!ref) return;
        location.href = `status.html?ref=${encodeURIComponent(ref)}`;
      }
      window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("btn").addEventListener("click", go);
        document.getElementById("ref").addEventListener("keydown", (e) => {
          if (e.key === "Enter") go();
        });
      });
    </script>
  </head>
  <body>
    <main class="container" style="padding: 2rem 1rem; max-width: 720px">
      <h1>Client Portal</h1>
      <p class="hero-subhead">
        Enter your reference ID to view your request status.
      </p>

      <label for="ref" style="display: block; margin-top: 1rem"
        >Reference ID</label
      >
      <input
        id="ref"
        type="text"
        placeholder="PRT-000001"
        style="
          width: 100%;
          padding: 0.8rem;
          border: 1px solid #ddd;
          border-radius: 12px;
        "
      />

      <button id="btn" class="btn btn-primary" style="margin-top: 1rem">
        View status
      </button>

      <p class="small-note" style="margin-top: 1rem">
        Tip: Your reference ID is included in the confirmation email you
        received.
      </p>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Status | Forethought Care & Support</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .card { border:1px solid #e6e6e6; border-radius:16px; padding:16px; }
    .muted { color:#666; }
    .error { color:#b00020; }
    .row { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#f2f2f2; }
  </style>
</head>
<body>
  <main class="container" style="padding:2rem 1rem; max-width:820px;">
    <h1>Request Status</h1>
    <div id="root" class="card">Loading…</div>

    <p style="margin-top:1rem;">
      <a href="index.html" class="btn btn-secondary">Check another reference</a>
    </p>
  </main>

  <script>
    const root = document.getElementById('root');
    const ref = new URLSearchParams(location.search).get('ref');

    function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    async function load() {
      if (!ref) {
        root.innerHTML = '<p class="error">Missing reference ID.</p>';
        return;
      }

      const r = await fetch(`/api/request-status?ref=${encodeURIComponent(ref)}`);
      const data = await r.json().catch(() => ({}));

      if (!r.ok) {
        root.innerHTML = `<p class="error">${esc(data.error || 'Unable to retrieve status.')}</p>`;
        return;
      }

      const actionRequired = (data.actionRequired === true || data.actionRequired === "true");
      root.innerHTML = `
        <div class="row">
          <div>
            <h2 style="margin:0 0 .25rem 0;">${esc(data.name)}</h2>
            <div class="muted">Reference: <b>${esc(data.reference)}</b></div>
          </div>
          <div>
            <span class="pill"><b>Status:</b> ${esc(data.stageLabel || data.stage)}</span>
          </div>
        </div>

        <hr style="border:none; border-top:1px solid #eee; margin:1rem 0;" />

        <p><b>Request type:</b> ${esc(data.requestType || '-')}</p>
        <p><b>Action required:</b> ${actionRequired ? 'Yes' : 'No'}</p>
        <p class="muted"><b>Last updated:</b> ${esc(data.lastUpdated || '-')}</p>
      `;
    }

    load();
  </script>
</body>
</html>
